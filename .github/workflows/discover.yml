name: discover books

# Searches Open Library (by subject) and Hardcover (by genre keyword) for books in the
# target genres and appends new ones to data/candidates.csv, which is committed back
# to the repo so the list can be reviewed (and edited) on GitHub before importing.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Total number of candidates wanted in the list"
        default: "470"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Discover
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          OPENLIBRARY_USER_AGENT: ${{ secrets.OPENLIBRARY_USER_AGENT }}
        run: python -m pipeline.discover --target "${{ inputs.target }}"
      - name: Commit the candidate list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.csv
          git diff --cached --quiet || git commit -m "Discovery: update candidate list"
          git push
