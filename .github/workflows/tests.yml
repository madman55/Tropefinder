name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check taxonomy
        run: python -m pipeline.taxonomy
      - name: Unit tests
        run: python -m pytest -q

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Emulate Supabase roles
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/local_roles.sql
      - name: Apply migrations
        run: for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Seed twice (must be repeatable)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Schema smoke test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/schema_smoke_test.sql | tee result.txt && grep -q "ALL SCHEMA CHECKS PASSED" result.txt
