name: classify tropes

# Classifies every stored book against the trope list (tag matching + Claude Haiku),
# then scores the result against data/gold_labels.csv.
# Manual only: Actions tab -> "classify tropes" -> Run workflow.
# Dry run (the default) classifies and scores but writes nothing to the database.
# The report appears on the run's summary page.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (classify and score, write nothing)"
        type: boolean
        default: true
      force:
        description: "Re-classify books already done with this prompt version"
        type: boolean
        default: false
      no_ai:
        description: "Tag matching only (no AI, free)"
        type: boolean
        default: false

concurrency:
  group: database-writes
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Classify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          [ "${{ inputs.no_ai }}" = "true" ] && args="$args --no-ai"
          python -m pipeline.classify.run $args
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classification-report
          path: data/reports/
          retention-days: 30
