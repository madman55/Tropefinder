name: migrate database

# Applies new files in supabase/migrations to the live database through the Supabase
# Management API (needs the SUPABASE_ACCESS_TOKEN secret). Each file runs once; a
# private table records what has been applied. Dry run (default) only lists them.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list pending migrations, apply nothing)"
        type: boolean
        default: true

concurrency:
  group: database-writes
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Migrate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python -m pipeline.migrate --dry-run; else python -m pipeline.migrate; fi
