name: deploy search page

# Publishes web/ to GitHub Pages. config.js is written here from repository
# VARIABLES (not secrets): the Supabase URL and the *publishable* key, which is
# designed to be public and can only read what row-level security allows.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js
        env:
          URL: ${{ vars.SUPABASE_URL || 'https://cnqtkfdzpmgkcreezpft.supabase.co' }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "Repository variable SUPABASE_PUBLISHABLE_KEY is not set"; exit 1; fi
          case "$KEY" in sb_secret_*) echo "That is a SECRET key. Use the publishable key."; exit 1;; esac
          printf 'window.TROPEFINDER_CONFIG = { url: "%s", key: "%s" };\n' "$URL" "$KEY" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
