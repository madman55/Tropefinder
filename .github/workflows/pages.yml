name: deploy search page

# Publishes web/ to GitHub Pages. config.js is written here from repository
# VARIABLES (not secrets): the Supabase URL and the *publishable* key, which is
# designed to be public and can only read what row-level security allows.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js
        env:
          URL: ${{ vars.SUPABASE_URL || 'https://cnqtkfdzpmgkcreezpft.supabase.co' }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "Repository variable SUPABASE_PUBLISHABLE_KEY is not set"; exit 1; fi
          case "$KEY" in sb_secret_*) echo "That is a SECRET key. Use the publishable key."; exit 1;; esac
          printf 'window.TROPEFINDER_CONFIG = { url: "%s", key: "%s" };\n' "$URL" "$KEY" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

  check:
    # After deploying: prove the live page and the public read path work, using only
    # the publishable key (exactly what visitors' browsers use).
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Page is served
        run: curl -fsS "${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}" | grep -q "TropeFinder"
      - name: Public search works on the real data
        env:
          URL: ${{ vars.SUPABASE_URL || 'https://cnqtkfdzpmgkcreezpft.supabase.co' }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          h=(-H "apikey: $KEY" -H "Content-Type: application/json")
          echo "Tropes readable: $(curl -fsS "${h[@]}" "$URL/rest/v1/tropes?select=slug" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          curl -fsS "${h[@]}" -X POST "$URL/rest/v1/rpc/search_books" \
            -d '{"must":["magic","modern-firearms"],"prefer":["military-characters"],"exclude":["romance"],"max_results":10}' > r.json
          python3 - <<'PY'
          import json
          rows = json.load(open("r.json"))
          print(f"Search 'magic + modern firearms, nice: soldiers, not: romance' -> {len(rows)} results")
          for r in rows:
              print(f"  [{r['band']}] {r['title']} - has {', '.join(r['must_matched'] + r['prefer_matched'])}"
                    + (f"; not confirmed: {', '.join(r['must_unknown'])}" if r['band'] == 'possible' else "")
                    + (f"; romance not ruled out" if r['exclude_not_ruled_out'] else ""))
          assert rows, "search returned nothing"
          PY
      - name: Public key cannot write
        env:
          URL: ${{ vars.SUPABASE_URL || 'https://cnqtkfdzpmgkcreezpft.supabase.co' }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -X POST "$URL/rest/v1/works" -d '{"title":"x","normalised_title":"x"}')
          echo "Insert with the public key answered HTTP $code"
          [ "$code" -ge 400 ] || { echo "PUBLIC KEY COULD WRITE"; exit 1; }
