name: enrich hardcover

# Adds Hardcover tags, formats, series and missing descriptions to the seed books,
# and creates seed books missing from Open Library using Hardcover data.
# Manual only: Actions tab -> "enrich hardcover" -> Run workflow.
# Dry run (the default) fetches and matches but writes nothing.
# The match report appears on the run's summary page and as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fetch and match, write nothing)"
        type: boolean
        default: true
      list:
        description: "Which list"
        type: choice
        options: [data/seed_books.csv, data/candidates.csv]
        default: data/seed_books.csv
      offset:
        description: "Skip the first N books of the list"
        default: "0"
      limit:
        description: "How many books (blank = all)"
        default: ""
      recheck:
        description: "Only recheck stored links and remove ones with incompatible titles (no API calls)"
        type: boolean
        default: false

concurrency:
  group: database-writes
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Enrich
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: |
          args="--list ${{ inputs.list }} --offset ${{ inputs.offset }}"
          [ -n "${{ inputs.limit }}" ] && args="$args --limit ${{ inputs.limit }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.recheck }}" = "true" ] && args="$args --recheck"
          python -m pipeline.enrich_hardcover $args
      - name: Keep report and raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardcover-enrichment
          path: |
            data/reports/
            data/cache/hardcover/
          retention-days: 30
