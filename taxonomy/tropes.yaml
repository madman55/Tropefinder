# TropeFinder trope taxonomy — version 0.1 (draft, 2026-11-25)
#
# HOW TO EDIT
#   * One entry per trope. "slug" is its permanent ID: lowercase words joined by hyphens.
#     Never change a slug once books are classified with it; add an alias instead.
#   * "parent" makes it a child of another trope (e.g. special-forces -> soldier).
#   * "definition" is what the trope means. "classifier_hint" tells the AI (and you)
#     where the line is. Both should be one or two plain sentences.
#   * "aliases" are other words people search for, and tags other sites use.
#   * "related" / "conflicts" list other slugs. Conflicts get flagged for review
#     when a book is tagged with both.
#   * Run `python -m pipeline.taxonomy` to check the file before committing.
#
# Categories: protagonist, abilities, setting, story-mechanics, technology,
#             relationships, structure-and-tone, format

tropes:

  # ---------------------------------------------------------------- protagonist
  - slug: soldier
    name: Soldier protagonist
    category: protagonist
    definition: The main character is or was a member of an organised military force.
    classifier_hint: Current or former service counts. Mercenaries count; police do not.
    aliases: [military protagonist, marine, army]
  - slug: special-forces
    name: Special forces operator
    category: protagonist
    parent: soldier
    definition: The main character serves or served in an elite special operations unit.
    aliases: [navy seal, sas, delta force, spec ops]
  - slug: veteran
    name: Veteran protagonist
    category: protagonist
    parent: soldier
    definition: The main character has left military service and that past shapes the story.
    aliases: [ex-military, retired soldier]
  - slug: futuristic-soldier
    name: Futuristic soldier
    category: protagonist
    parent: soldier
    definition: The main character is a soldier from a technologically advanced future or civilisation.
    aliases: [space marine, future soldier]
  - slug: assassin
    name: Assassin protagonist
    category: protagonist
    definition: The main character kills targets professionally or for an organisation.
    aliases: [hitman, contract killer]
  - slug: detective
    name: Detective protagonist
    category: protagonist
    definition: The main character investigates crimes or mysteries as a central part of the plot.
    aliases: [investigator, private eye, sleuth]
  - slug: police-officer
    name: Police officer
    category: protagonist
    parent: detective
    definition: The main character is a serving police officer.
    aliases: [cop, constable]
  - slug: scientist
    name: Scientist protagonist
    category: protagonist
    definition: The main character is a scientist or engineer and uses that expertise to drive the plot.
    aliases: [engineer protagonist]
  - slug: civilian
    name: Ordinary civilian
    category: protagonist
    definition: The main character starts as an ordinary person with no special training or powers.
    aliases: [everyman, ordinary person]
  - slug: government-operative
    name: Government operative
    category: protagonist
    definition: The main character works for a government agency on covert or classified missions.
    aliases: [agent, government agent]
  - slug: spy
    name: Spy
    category: protagonist
    parent: government-operative
    definition: The main character gathers intelligence covertly.
    aliases: [espionage, intelligence officer]
  - slug: secret-agency
    name: Secret agency
    category: protagonist
    parent: government-operative
    definition: The main character belongs to a hidden or deniable organisation, often dealing with the supernatural.
    aliases: [secret organisation, black ops agency]
  - slug: superhero
    name: Superhero protagonist
    category: protagonist
    definition: The main character uses extraordinary powers to fight crime or protect others, usually in a world with other supers.
    aliases: [cape, hero, supers]
  - slug: antihero
    name: Antihero
    category: protagonist
    definition: The main character lacks conventional heroic morals but is still the focus of sympathy.
    aliases: [morally grey protagonist, villain protagonist]
  - slug: non-human-protagonist
    name: Non-human protagonist
    category: protagonist
    definition: The main character is not human.
    aliases: [inhuman protagonist]
  - slug: ai-protagonist
    name: AI protagonist
    category: protagonist
    parent: non-human-protagonist
    definition: The main character is an artificial intelligence or robot.
    aliases: [robot protagonist, android]
  - slug: monster-protagonist
    name: Monster protagonist
    category: protagonist
    parent: non-human-protagonist
    definition: The main character is a monster, undead or creature usually cast as a villain.
    aliases: [monster mc, reincarnated as a monster]
  - slug: alien-protagonist
    name: Alien protagonist
    category: protagonist
    parent: non-human-protagonist
    definition: The main character is an alien.

  # ---------------------------------------------------------------- abilities
  - slug: superpowers
    name: Superpowers
    category: abilities
    definition: Characters have innate or acquired extraordinary powers not framed as magic.
    aliases: [powers, metahumans]
  - slug: magic
    name: Magic
    category: abilities
    definition: Characters use magic or spellcasting.
    aliases: [sorcery, spells, wizards]
  - slug: hard-magic-system
    name: Hard magic system
    category: abilities
    parent: magic
    definition: Magic follows clear, explained rules and limits that the plot relies on.
    aliases: [rules-based magic]
  - slug: soft-magic
    name: Soft magic
    category: abilities
    parent: magic
    definition: Magic is mysterious and its rules are not spelled out.
  - slug: psychic-abilities
    name: Psychic abilities
    category: abilities
    definition: Characters use telepathy, telekinesis, precognition or similar mental powers.
    aliases: [telepathy, telekinesis, psionics]
  - slug: cybernetic-enhancements
    name: Cybernetic enhancements
    category: abilities
    definition: Characters have machine parts or implants that improve their abilities.
    aliases: [cyborg, implants, augmentation]
  - slug: superhuman-strength
    name: Superhuman strength
    category: abilities
    definition: A character's physical strength or toughness is far beyond human limits.
  - slug: immortality
    name: Immortality
    category: abilities
    definition: A character cannot die of age, or returns from death.
    aliases: [immortal, undying]
  - slug: healing-abilities
    name: Healing abilities
    category: abilities
    definition: A character can heal themselves or others by extraordinary means.
    aliases: [regeneration, healer]
  - slug: technological-enhancements
    name: Technological enhancements
    category: abilities
    definition: Characters gain abilities from external technology such as power armour or advanced gear.
    aliases: [power armour, exosuit]
  - slug: acquired-powers
    name: Acquired powers
    category: abilities
    definition: The main character gains their powers during the story rather than starting with them.
    aliases: [gains powers, awakening]

  # ---------------------------------------------------------------- setting
  - slug: modern-earth
    name: Modern Earth
    category: setting
    definition: The story is set on present-day or near-present Earth.
    aliases: [contemporary, present day]
  - slug: urban-setting
    name: Modern city setting
    category: setting
    parent: modern-earth
    definition: The story takes place mainly in a real or realistic modern city.
    aliases: [urban fantasy setting, city]
  - slug: alternate-earth
    name: Alternate Earth
    category: setting
    definition: Earth with a changed history or fundamentally different present.
    aliases: [alternate history, alt history]
  - slug: futuristic-civilisation
    name: Futuristic civilisation
    category: setting
    definition: The story is set in a technologically advanced future society.
    aliases: [future, far future]
  - slug: medieval-fantasy
    name: Medieval-style world
    category: setting
    definition: The story is set in a pre-industrial world resembling medieval or ancient times.
    aliases: [medieval, secondary world fantasy]
  - slug: post-apocalyptic
    name: Post-apocalyptic world
    category: setting
    definition: The story takes place after a civilisation-ending catastrophe.
    aliases: [apocalypse, wasteland]
  - slug: alien-planet
    name: Alien planet
    category: setting
    definition: Much of the story takes place on a planet other than Earth.
  - slug: parallel-universe
    name: Parallel universe
    category: setting
    definition: Characters reach or live in another universe or dimension.
    aliases: [another world, alternate dimension, multiverse]
  - slug: hidden-supernatural-society
    name: Hidden supernatural society
    category: setting
    definition: A secret world of magic or supernatural beings exists alongside the ordinary one.
    aliases: [masquerade, hidden world]
  - slug: space-setting
    name: Space setting
    category: setting
    definition: Much of the story takes place in space, on ships or stations.
    aliases: [space opera]

  # ---------------------------------------------------------------- story mechanics
  - slug: portal-fantasy
    name: Portal fantasy
    category: story-mechanics
    definition: A character travels from our world (or theirs) into a different world.
    classifier_hint: Must cross between worlds. Time travel within one world is time-travel instead.
    aliases: [transported to another world, trapped in another world]
  - slug: isekai
    name: Isekai
    category: story-mechanics
    parent: portal-fantasy
    definition: A person from modern Earth is transported, summoned or reborn into another world, in the Japanese light-novel tradition.
  - slug: reincarnation
    name: Reincarnation
    category: story-mechanics
    definition: A character dies and is reborn as someone or something else, keeping their memories.
    aliases: [reborn, second life, regression]
  - slug: time-travel
    name: Time travel
    category: story-mechanics
    definition: A character moves to a different time.
    aliases: [time traveller]
  - slug: time-loop
    name: Time loop
    category: story-mechanics
    parent: time-travel
    definition: A character relives the same span of time repeatedly.
    aliases: [groundhog day]
  - slug: power-progression
    name: Power progression
    category: story-mechanics
    definition: A character's growth in power is a central, tracked part of the story.
    aliases: [progression fantasy, cultivation, levelling up]
  - slug: secret-identity
    name: Secret identity
    category: story-mechanics
    definition: A character hides who they really are behind another identity.
  - slug: hidden-abilities
    name: Hidden abilities
    category: story-mechanics
    definition: A character deliberately conceals the true extent of their abilities.
    aliases: [hiding power, secretly strong]
  - slug: military-operations
    name: Military operations
    category: story-mechanics
    definition: Organised military missions, campaigns or battles drive the plot.
    aliases: [war, campaign, missions]
  - slug: team-based-adventure
    name: Team-based adventure
    category: story-mechanics
    definition: A team or squad working together is central to the story.
    aliases: [squad, party, ensemble team]
  - slug: survival
    name: Survival
    category: story-mechanics
    definition: Staying alive against hostile conditions is a central goal.
  - slug: exploration
    name: Exploration
    category: story-mechanics
    definition: Discovering unknown places is a central part of the plot.
  - slug: base-building
    name: Kingdom or base building
    category: story-mechanics
    definition: The main character builds and manages a settlement, base, kingdom or organisation.
    aliases: [kingdom building, settlement building]

  # ---------------------------------------------------------------- technology
  - slug: modern-firearms
    name: Modern firearms
    category: technology
    definition: Guns of modern or near-modern design are used in the story.
    aliases: [guns, firearms]
  - slug: firearms-effective-vs-magic
    name: Firearms work against magical creatures
    category: technology
    parent: modern-firearms
    definition: Guns are shown to injure or kill supernatural beings.
    classifier_hint: Needs explicit text; guns merely existing is not enough.
    aliases: [guns vs monsters, bullets work on magic]
    related: [magic-tech-coexist]
    conflicts: [magic-disrupts-tech]
  - slug: advanced-military-tech
    name: Advanced military technology
    category: technology
    definition: Futuristic weapons, vehicles or armour feature prominently.
    aliases: [mechs, starships, military sci-fi tech]
  - slug: artificial-intelligence
    name: Artificial intelligence
    category: technology
    definition: An artificial intelligence is a significant character or plot element.
    aliases: [ai, sentient computer]
  - slug: space-travel
    name: Space travel
    category: technology
    definition: Characters travel between planets or stars.
    aliases: [faster than light, ftl]
  - slug: magic-tech-coexist
    name: Magic and technology coexist
    category: technology
    definition: Magic and modern or advanced technology both work and are used together.
    aliases: [science fantasy, technomancy]
    conflicts: [magic-disrupts-tech]
  - slug: magic-disrupts-tech
    name: Magic interferes with technology
    category: technology
    definition: Magic damages, disables or cannot work alongside technology.
    aliases: [magic breaks electronics]
  - slug: technology-uplift
    name: Technology uplift
    category: technology
    definition: A character brings modern knowledge or technology into a less advanced world and changes it.
    aliases: [modern knowledge, uplift, engineering in another world]

  # ---------------------------------------------------------------- relationships
  - slug: romance
    name: Romance
    category: relationships
    definition: A romantic relationship features in the story.
    classifier_hint: Use the children to say how central it is when the text allows.
    aliases: [love story]
  - slug: romance-subplot
    name: Romance subplot
    category: relationships
    parent: romance
    definition: Romance is present but secondary to the main plot.
    aliases: [light romance]
  - slug: romance-led
    name: Romance-led story
    category: relationships
    parent: romance
    definition: The romantic relationship is the main plot.
    aliases: [romantasy, romance focused]
  - slug: harem
    name: Harem
    category: relationships
    definition: The main character has several romantic or sexual partners as a central feature.
    aliases: [reverse harem, why choose]
  - slug: found-family
    name: Found family
    category: relationships
    definition: Characters with no blood ties form a family-like bond.
  - slug: mentor-figure
    name: Mentor figure
    category: relationships
    definition: An experienced character trains or guides the main character.
    aliases: [master and apprentice, teacher]

  # ---------------------------------------------------------------- structure and tone
  - slug: academy-setting
    name: Academy setting
    category: structure-and-tone
    definition: Much of the story takes place at a school, academy or training institution.
    aliases: [magic school, magic academy, school setting]
  - slug: litrpg-mechanics
    name: LitRPG mechanics
    category: structure-and-tone
    definition: The world runs on visible game mechanics such as levels, stats, skills or system messages.
    aliases: [litrpg, gamelit, game system]
  - slug: system-interface
    name: System interface
    category: structure-and-tone
    parent: litrpg-mechanics
    definition: Characters see on-screen style prompts, status screens or notifications.
    aliases: [the system, status screen]
  - slug: multiple-protagonists
    name: Multiple protagonists
    category: structure-and-tone
    definition: The story follows several main characters, often with alternating points of view.
    aliases: [multiple pov, ensemble cast]
  - slug: overpowered-protagonist
    name: Overpowered protagonist
    category: structure-and-tone
    definition: The main character is far stronger than most opponents for much of the story.
    aliases: [op mc, overpowered mc]
    conflicts: [slow-progression]
  - slug: slow-progression
    name: Slow progression
    category: structure-and-tone
    definition: The main character's growth in power is gradual and hard-won.
    aliases: [slow burn progression, weak to strong]
  - slug: action-heavy
    name: Action-heavy
    category: structure-and-tone
    definition: Fights, combat and set-piece action take up much of the story.
    aliases: [fast-paced, action packed]
  - slug: dark-tone
    name: Dark tone
    category: structure-and-tone
    definition: The story is bleak, violent or grim in overall tone.
    aliases: [grimdark, dark]
  - slug: humorous-tone
    name: Humorous tone
    category: structure-and-tone
    definition: Comedy is a major part of the story's voice.
    aliases: [funny, comedic, lighthearted]

  # ---------------------------------------------------------------- format
  - slug: standalone
    name: Standalone
    category: format
    definition: The book is complete on its own and not part of a series.
    conflicts: [series-entry]
  - slug: series-entry
    name: Part of a series
    category: format
    definition: The book belongs to a series.
  - slug: web-serial-origin
    name: Web serial origin
    category: format
    definition: The story was first published online in instalments.
    aliases: [web novel, royal road, serial]
